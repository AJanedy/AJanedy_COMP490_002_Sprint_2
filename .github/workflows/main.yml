name: Run Tests

on:
  push:
    branches:
      - main  # or the branch where you want tests to run
  pull_request:
    branches:
      - main  # tests run on pull requests targeting the main branch

jobs:
  test:
    runs-on: ubuntu-latest  # Use the latest version of Ubuntu for the job

    steps:
      - name: Checkout code
        uses: actions/checkout@v2  # This action checks out your code

      - name: Set up Python
        uses: actions/setup-python@v2  # This action sets up the Python environment
        with:
          python-version: 3.8  # Specify the Python version you want to use

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # Install dependencies from your requirements file

      - name: Run tests
        run: |
          pytest  # Run pytest to execute your tests
